<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGN Preisvergleich</title>
    <link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="script.js"></script>
	</head>
	<body>
<div class="container">
<div class="header">
<h1>VGN Tarifvergleich</h1>
<p>Vergleich von EGON, Deutschlandticket, Einzel- und TagesTickets</p>
</div>
<form onsubmit="rechnen(); return false;">

    <label for="stufe">Tarifstufe:</label>
    <select id="stufe">
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
    <option value="D">D</option>
    <option value="E">E</option>
    <option value="F">F</option>

    <option value="1">1</option>
    <option value="2">2</option>
    <option value="2+T">2+T</option>
    <option value="3">3</option>
    <option value="3+T">3+T</option>
    <option value="4">4</option>
    <option value="4+T">4+T</option>
    <option value="5">5</option>
    <option value="5+T">5+T</option>
    <option value="6">6</option>
    <option value="6+T">6+T</option>
    <option value="7">7</option>
    <option value="7+T">7+T</option>
    <option value="8">8</option>
    <option value="8+T">8+T</option>
    <option value="9">9</option>
    <option value="9+T">9+T</option>
    <option value="10">10</option>
    <option value="10+T">10+T</option>
    </select>
    <br><br>

    <label for="fahrten">Fahrten pro Tag:</label>
    <input id="fahrten" type="number" min="1" max="5" value="2">
    <br><br>
	<label for="strecke">Strecke in Kilometer:</label>
    <input id="strecke" type="number" min="1" max="100" value="1">
    <br><br>
	<label for="egonsonder">Egon Sonderfall:</label>
    <select id="egonsonder">
    <option value="false" selected>Normal</option>
    <option value="true">100|200</option>
	</select>
    <br><br>
    
    <label>Wollen Sie jemanden mitnehmen?
    <input type="checkbox" id="Mitnahme">
    </label>
    <br><br>
    <div id="additionalFields" style="display:none;">
    <label for="ErwachsenMitnahme">Ein Erwachsenen mitnehmen:</label>
    <select id="ErwachsenMitnahme">
    <option value="false" selected>Nein</option>
    <option value="true">Ja</option>
	</select>
    <br><br>
	<label for="KinderMitname">Hund/Kind/Fahrad mitnehmen:</label>
    <input id="KinderMitname" type="number" min="0" max="5" value="1">
    <p id="ergebniss"></p>
    </div>
    <button type="submit">Berechnen</button>
    <br><br>
</form>
<div class="chart-card" id="chartCard" style="display:none;">
	<canvas id="chart"></canvas>
    </div>
    </div>	
</body>
</html>
